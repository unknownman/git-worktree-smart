[package]
name = "git-worktree-smart"
version = "0.1.0+build.2"
edition = "2021"
description = "A lightweight, human-friendly, and beautiful Git worktree manager"
license = "MIT"
authors = ["Ali Joder <ali.masoudi.alavi@gmail.com>"]
repository = "https://github.com/unknownman/git-worktree-smart"
readme = "README.md"
keywords = ["git", "worktree", "cli", "productivity", "git-tools"]
categories = ["command-line-utilities", "development-tools"]
default-run = "wt"

[[bin]]
name = "wt"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "cargo"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
comfy-table = "7"
owo-colors = "4"
dirs = "5"
dunce = "1"
fuzzy-matcher = "0.3"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
