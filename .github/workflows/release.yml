name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: false
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            use_cross: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
            use_cross: false
          - target: aarch64-apple-darwin
            os: macos-latest
            use_cross: false
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            use_cross: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Cross
        if: matrix.use_cross
        uses: taiki-e/install-action@cross

      - name: Build binary
        shell: bash
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }} --locked
          else
            cargo build --release --target ${{ matrix.target }} --locked
          fi

      - name: Package artifact (Unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          PKG_NAME="git-worktree-smart-${TAG}-${{ matrix.target }}"
          ARCHIVE_DIR="target/staging/${PKG_NAME}"
          mkdir -p "${ARCHIVE_DIR}"
          cp "target/${{ matrix.target }}/release/wt" "${ARCHIVE_DIR}/"
          cp README.md LICENSE "${ARCHIVE_DIR}/"
          tar -czf "target/${PKG_NAME}.tar.gz" -C "target/staging" "${PKG_NAME}"
          cd target
          if command -v shasum >/dev/null 2>&1; then
            shasum -a 256 "${PKG_NAME}.tar.gz" > "${PKG_NAME}.tar.gz.sha256"
          else
            sha256sum "${PKG_NAME}.tar.gz" > "${PKG_NAME}.tar.gz.sha256"
          fi

      - name: Package artifact (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          PKG_NAME="git-worktree-smart-${TAG}-${{ matrix.target }}"
          ARCHIVE_DIR="target/staging/${PKG_NAME}"
          mkdir -p "${ARCHIVE_DIR}"
          cp "target/${{ matrix.target }}/release/wt.exe" "${ARCHIVE_DIR}/"
          cp README.md LICENSE "${ARCHIVE_DIR}/"
          7z a -tzip "target/${PKG_NAME}.zip" "./${ARCHIVE_DIR}/*"
          cd target
          if command -v shasum >/dev/null 2>&1; then
            shasum -a 256 "${PKG_NAME}.zip" > "${PKG_NAME}.zip.sha256"
          else
            sha256sum "${PKG_NAME}.zip" > "${PKG_NAME}.zip.sha256"
          fi

      - name: Upload artifact to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/git-worktree-smart-${{ github.ref_name }}-${{ matrix.target }}.tar.gz
            target/git-worktree-smart-${{ github.ref_name }}-${{ matrix.target }}.tar.gz.sha256
            target/git-worktree-smart-${{ github.ref_name }}-${{ matrix.target }}.zip
            target/git-worktree-smart-${{ github.ref_name }}-${{ matrix.target }}.zip.sha256
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-crates-io:
    name: Publish to Crates.io
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Publish to Crates.io
        run: cargo publish --locked --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
